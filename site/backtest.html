<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>과거 성과 검증</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 판정 띠 → 핵심 지표 표 → 누적가치 차트 → 낙폭·IC → 연도별·비교 실험 표 */
:root{
  --bg:#f5f6f8; --surface:#fcfcfb; --ink:#16202c; --muted:#5d6878; --line:#dde1e7; --soft:#eceff3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --up:#c8322b; --down:#2559b8; --warn:#9a6400; --warn-soft:#fbf1dc;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7; --line:#2f3640; --soft:#232a33;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --up:#ef6b62; --down:#6f9cf0; --warn:#e2b04f; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7; --line:#2f3640; --soft:#232a33;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --up:#ef6b62; --down:#6f9cf0; --warn:#e2b04f; --warn-soft:#33290f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance} h2{font-size:15px;margin:0 0 8px}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.notice{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:6px;padding:9px 12px;font-size:13px}
.notice strong{color:var(--warn)}
.wrap>*,#body,#body>*{min-width:0}
#body{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th.l,td.l{text-align:left}
td{font-family:var(--font-num);font-variant-numeric:tabular-nums}
td.l{font-family:var(--font-body)}
.up{color:var(--up)} .down{color:var(--down)} .dash{color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;white-space:nowrap}
.tip b{font-family:var(--font-num);font-weight:500}
.empty{color:var(--muted);padding:24px 0}
a{color:var(--s1)}
footer{color:var(--muted);font-size:12px}
</style>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>과거 성과 검증</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="notice" id="verdict"></div>
  <div id="body"></div>
  <footer><a href="./">← 저평가 스크리너로</a> · 수익률은 수정주가·배당 미포함 기준. 과거 성과가 미래를 보장하지 않습니다.</footer>
</div>
<script>
const D = {"run":null,"nav":[],"variants":null,"index":{},"ew":[]};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (v,d=1,color=true) => v==null||!isFinite(v) ? '<span class="dash">–</span>' : `<span class="${color?(v>0?'up':v<0?'down':''):''}">${(v*100).toFixed(d)}%</span>`;
const num = (v,d=2) => v==null||!isFinite(v) ? '<span class="dash">–</span>' : v.toFixed(d);
const fmtD = d => `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const R = D.run;
if(!R){
  document.getElementById("verdict").innerHTML = "<strong>아직 결과가 없습니다.</strong> 2015년 이후 전 종목 재무와 2017년 이후 시세 수집이 끝나면 개발 구간(2018-04 ~ 2022-03) 검증을 실행해 이 화면에 올립니다.";
} else {
  document.getElementById("meta").innerHTML = `<span>구간 <b>${esc(R.window[0])} ~ ${esc(R.window[1])}</b></span><span>${R.mode==="dev"?"개발 구간":R.mode==="validation"?"검증 구간":"점검"}</span><span>전략 ${esc(R.strategy)}</span><span>비용 시나리오 ${esc({optimistic:"낙관",base:"기준",conservative:"보수"}[R.scenario]||R.scenario)}</span><span>리밸런싱 ${R.rebalances}회</span>`;
  document.getElementById("verdict").innerHTML = `<strong>탐색적 분석입니다.</strong> 백테스트 인정 조건(DESIGN 7.2)이 모두 충족되지 않았습니다: ${esc((R.limitations||[]).join(" · "))}`;
  const b = document.getElementById("body");
  const P = R.perf||{}, K = R.benchmark_KOSPI||{}, Q = R.benchmark_KOSDAQ||{};
  const row = (n,p,extra="") => `<tr><td class="l">${n}</td><td>${pct(p.total_return)}</td><td>${pct(p.cagr)}</td><td>${pct(p.mdd)}</td><td>${pct(p.vol,1,false)}</td><td>${num(p.sharpe_rf0)}</td>${extra}</tr>`;
  b.innerHTML = `
  <div class="card"><h2>핵심 지표</h2><div class="tbl"><table>
    <thead><tr><th class="l">구분</th><th>누적</th><th>연평균(CAGR)</th><th>최대낙폭</th><th>변동성</th><th>샤프(무위험 0)</th></tr></thead>
    <tbody>${row("전략 (20종목, 비용 차감)",P)}${row("코스피 지수",K)}${row("코스닥 지수",Q)}
    <tr><td class="l">순위 대상 전체 동일비중 (비용 전)</td><td>${pct((R.benchmark_universe_ew||{}).total_return)}</td><td colspan="4" class="l dash">구간 수익률만</td></tr></tbody></table></div>
    <div class="tbl" style="margin-top:10px"><table><thead><tr><th class="l">신호 품질</th><th>IC 평균</th><th>IC 표준편차</th><th>IC IR</th><th>표본 수</th><th>적중률(사업군 평균 초과)</th><th>평균 회전율</th><th>회당 비용</th><th>코스피 베타</th></tr></thead>
    <tbody><tr><td class="l">종합점수 vs 다음 기간 수익률</td><td>${num((R.ic||{}).mean,3)}</td><td>${num((R.ic||{}).std,3)}</td><td>${num((R.ic||{}).ir,2)}</td><td>${(R.ic||{}).n??'–'}</td><td>${pct(R.hit_rate,0,false)}</td><td>${pct(R.avg_turnover,0,false)}</td><td>${pct(R.avg_cost_per_rebalance,2,false)}</td><td>${num(R.beta_kospi,2)}</td></tr></tbody></table></div></div>
  <div class="card"><h2>누적가치 (시작 = 1.0)</h2><div class="legend" id="lg"></div><div class="chart" id="c1"></div><div class="tip" id="t1"></div></div>
  <div class="grid2">
    <div class="card"><h2>전략 낙폭</h2><div class="chart" id="c2"></div></div>
    <div class="card"><h2>리밸런싱별 IC</h2><div class="chart" id="c3"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>연도별 수익률</h2><div class="tbl" id="yr"></div></div>
    <div class="card"><h2>코스피 국면별 월평균 초과수익</h2><div class="tbl" id="rg"></div></div>
  </div>
  <div class="card"><h2>비교 실험 (DESIGN 7.5, 개발 구간)</h2><div class="tbl" id="vr"></div></div>
  <div class="card"><h2>마지막 보유 종목</h2><div class="tbl" id="hd"></div></div>`;
  drawNav(); drawDD(); drawIC(); tables();
}
function scale(d0,d1,r0,r1){return v=>r0+(v-d0)/(d1-d0||1)*(r1-r0);}
function svgEl(w,h){return `<svg viewBox="0 0 ${w} ${h}" role="img">`;}
function drawNav(){
  const nav=D.nav; if(!nav.length) return;
  const base=nav[0][1], days=nav.map(x=>x[0]);
  const series=[{k:"전략",c:"--s1",v:nav.map(x=>x[1]/base)}];
  const ix=D.index||{};
  if(ix.KOSPI&&ix.KOSPI.length){const m=Object.fromEntries(ix.KOSPI);const b0=m[days.find(d=>m[d])];series.push({k:"코스피",c:"--s2",v:days.map(d=>m[d]?m[d]/b0:null)});}
  if(ix.KOSDAQ&&ix.KOSDAQ.length){const m=Object.fromEntries(ix.KOSDAQ);const b0=m[days.find(d=>m[d])];series.push({k:"코스닥",c:"--s4",v:days.map(d=>m[d]?m[d]/b0:null)});}
  const W=1000,H=360,L=48,Rr=70,T=12,B=28;
  const all=series.flatMap(s=>s.v.filter(v=>v!=null)); const lo=Math.min(...all,1),hi=Math.max(...all,1);
  const x=scale(0,days.length-1,L,W-Rr), y=scale(lo,hi,H-B,T);
  let g=svgEl(W,H);
  const ticks=5; for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--soft')}"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="${css('--muted')}">${v.toFixed(2)}</text>`;}
  const yrs=[...new Set(days.map(d=>d.slice(0,4)))]; yrs.forEach(yy=>{const i=days.findIndex(d=>d.startsWith(yy));g+=`<text x="${x(i)}" y="${H-8}" font-size="11" fill="${css('--muted')}">${yy}</text>`;});
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(1)}" y2="${y(1)}" stroke="${css('--muted')}" stroke-dasharray="3 3"/>`;
  series.forEach(s=>{let p="";s.v.forEach((v,i)=>{if(v==null)return;p+=(p?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);});
    g+=`<path d="${p}" fill="none" stroke="${css(s.c)}" stroke-width="2"/>`;
    const li=s.v.length-1-[...s.v].reverse().findIndex(v=>v!=null);
    g+=`<text x="${x(li)+6}" y="${y(s.v[li])+4}" font-size="11" fill="${css('--ink')}">${s.k} ${s.v[li].toFixed(2)}</text>`;});
  g+=`<line id="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="${css('--muted')}" visibility="hidden"/></svg>`;
  const el=document.getElementById("c1"); el.innerHTML=g;
  document.getElementById("lg").innerHTML=series.map(s=>`<span><i style="background:${css(s.c)}"></i>${s.k}</span>`).join("");
  const svg=el.querySelector("svg"), tip=document.getElementById("t1"), cx=svg.querySelector("#cx");
  svg.addEventListener("pointermove",ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(days.length-1,Math.round((px-L)/(W-Rr-L)*(days.length-1))));
    cx.setAttribute("x1",x(i));cx.setAttribute("x2",x(i));cx.setAttribute("visibility","visible");
    tip.style.display="block";tip.innerHTML=`${fmtD(days[i])}<br>`+series.map(s=>`${s.k} <b>${s.v[i]==null?'–':s.v[i].toFixed(3)}</b>`).join("<br>");
    const tx=ev.clientX-el.getBoundingClientRect().left; tip.style.left=Math.min(tx+12,el.clientWidth-150)+"px"; tip.style.top="20px";});
  svg.addEventListener("pointerleave",()=>{tip.style.display="none";cx.setAttribute("visibility","hidden");});
}
function drawDD(){
  const nav=D.nav; if(!nav.length) return; let pk=-1e9; const dd=nav.map(x=>{pk=Math.max(pk,x[1]);return x[1]/pk-1;});
  const W=500,H=200,L=44,Rr=10,T=10,B=24, lo=Math.min(...dd,-0.01);
  const x=scale(0,dd.length-1,L,W-Rr), y=scale(lo,0,H-B,T);
  let p=`M${L},${y(0)}`; dd.forEach((v,i)=>p+=`L${x(i).toFixed(1)},${y(v).toFixed(1)}`); p+=`L${x(dd.length-1)},${y(0)}Z`;
  let g=svgEl(W,H)+`<path d="${p}" fill="${css('--s1')}" fill-opacity=".25" stroke="${css('--s1')}" stroke-width="1.5"/>`;
  [0,lo/2,lo].forEach(v=>g+=`<text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="${css('--muted')}">${(v*100).toFixed(0)}%</text>`);
  const mi=dd.indexOf(Math.min(...dd)); g+=`<circle cx="${x(mi)}" cy="${y(dd[mi])}" r="4" fill="${css('--s1')}" stroke="${css('--surface')}" stroke-width="2"/><text x="${x(mi)>W*0.6?x(mi)-6:x(mi)+6}" text-anchor="${x(mi)>W*0.6?'end':'start'}" y="${y(dd[mi])+14}" font-size="11" fill="${css('--ink')}">최대 ${(dd[mi]*100).toFixed(1)}% (${fmtD(nav[mi][0])})</text></svg>`;
  document.getElementById("c2").innerHTML=g;
}
function drawIC(){
  const ic=(D.ic||[]).filter(x=>x.ic!=null); if(!ic.length){document.getElementById("c3").innerHTML='<div class="empty">IC 없음</div>';return;}
  const W=500,H=200,L=40,Rr=10,T=10,B=24, m=Math.max(0.05,...ic.map(x=>Math.abs(x.ic)));
  const bw=(W-L-Rr)/ic.length, y=scale(-m,m,H-B,T);
  let g=svgEl(W,H)+`<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" stroke="${css('--muted')}"/>`;
  ic.forEach((v,i)=>{const h=Math.abs(y(v.ic)-y(0));g+=`<rect x="${L+i*bw+1}" y="${v.ic>=0?y(v.ic):y(0)}" width="${Math.max(1,bw-2)}" height="${Math.max(1,h)}" rx="2" fill="${css('--s1')}"><title>${fmtD(v.r)} IC ${v.ic.toFixed(3)}</title></rect>`;});
  [m,0,-m].forEach(v=>g+=`<text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="${css('--muted')}">${v.toFixed(2)}</text>`);
  document.getElementById("c3").innerHTML=g+"</svg>";
}
function tables(){
  const y=R.yearly||{}, ks=D.index&&D.index.KOSPI?Object.fromEntries(D.index.KOSPI):{};
  const kyr={}; let prev=null; Object.keys(ks).sort().forEach(d=>{const yy=d.slice(0,4); if(!kyr[yy]) kyr[yy]={s:prev??ks[d]}; kyr[yy].e=ks[d]; prev=ks[d];});
  document.getElementById("yr").innerHTML=`<table><thead><tr><th class="l">연도</th><th>전략</th><th>코스피</th><th>차이</th></tr></thead><tbody>${Object.keys(y).map(yy=>{const k=kyr[yy]?kyr[yy].e/kyr[yy].s-1:null;return `<tr><td class="l">${yy}</td><td>${pct(y[yy])}</td><td>${pct(k)}</td><td>${pct(k==null?null:y[yy]-k)}</td></tr>`;}).join("")}</tbody></table>`;
  const rg=R.regime_excess_vs_kospi_monthly||{};
  document.getElementById("rg").innerHTML=`<table><thead><tr><th class="l">국면(코스피 월간)</th><th>개월</th><th>월평균 초과</th></tr></thead><tbody>${Object.entries(rg).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v.months}</td><td>${pct(v.avg_excess,2)}</td></tr>`).join("")}</tbody></table>`;
  const V=D.variants;
  document.getElementById("vr").innerHTML = !V ? '<div class="empty">비교 실험 결과 없음</div>' :
   `<div class="dash" style="font-size:12px;margin-bottom:6px">${esc(V.rule)}</div><table><thead><tr><th class="l">변형</th><th>CAGR</th><th>최대낙폭</th><th>샤프</th><th>IC 평균</th><th>IC IR</th><th>적중률</th><th>회전율</th></tr></thead><tbody>${
   Object.entries(V.variants).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${pct(v.cagr)}</td><td>${pct(v.mdd)}</td><td>${num(v.sharpe)}</td><td>${num(v.ic_mean,3)}</td><td>${num(v.ic_ir,2)}</td><td>${pct(v.hit_rate,0,false)}</td><td>${pct(v.turnover,0,false)}</td></tr>`).join("")}</tbody></table>`;
  const h=D.last_holdings;
  document.getElementById("hd").innerHTML = !h ? '<div class="empty">없음</div>' :
   `<div class="dash" style="font-size:12px;margin-bottom:6px">리밸런싱 ${fmtD(h.rebalance)} · 체결 ${fmtD(h.exec)}</div><table><thead><tr><th class="l">종목</th><th>순위</th><th class="l">사업군</th></tr></thead><tbody>${h.holdings.map(x=>`<tr><td class="l">${esc(x.n)} <span class="dash">${x.c}</span></td><td>${x.rank??'–'}</td><td class="l">${esc(x.g)}</td></tr>`).join("")}</tbody></table>`;
}
</script>

</body>
</html>
