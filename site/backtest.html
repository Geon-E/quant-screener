}

.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

.wrap>*,#body,#body>*{min-width:0}
#body{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .dash{color:var(--muted)}
/* 차트 */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--s1);outline-offset:4px;border-radius:4px}
.chart .grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart .tk{font-size:11px;fill:var(--muted)}
.chart .lab{font-size:12px;fill:var(--ink);font-weight:600}
.chart .lab2{font-size:11.5px;fill:var(--ink2)}
.chart .cx{stroke:var(--muted);stroke-width:1;shape-rendering:crispEdges}
.chart .bar{transition:opacity 120ms}
.chart.hovering .bar{opacity:.45} .chart.hovering .bar.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:16px;height:2px;border-radius:1px}
.legend i.box{width:10px;height:10px;border-radius:2px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--tip-shadow);white-space:nowrap;opacity:0;transition:opacity 120ms;min-width:140px}
.tip.show{opacity:1}
.tip .d{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.tip .r{display:grid;grid-template-columns:14px auto 1fr;align-items:center;gap:6px;line-height:1.7}
.tip .r i{display:block;width:12px;height:2px;border-radius:1px}
.tip .r b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .r span{color:var(--ink2)}
.tip .r small{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
@media (prefers-reduced-motion:reduce){.tip,.chart .bar{transition:none}}
.empty{color:var(--muted);padding:24px 0}
a{color:var(--s1);text-underline-offset:3px}
footer{color:var(--muted);font-size:12.5px}

  hover(el,svg,W,days.length,px=>Math.round((px-L)/(W-Rr-L)*(days.length-1)),(i,k)=>{
    cx.setAttribute("x1",x(i)); cx.setAttribute("x2",x(i)); hv.setAttribute("visibility","visible");
    series.forEach((s,j)=>{const c=svg.querySelector("#hd"+j); if(s.v[i]==null){c.setAttribute("visibility","hidden");return;} c.setAttribute("visibility","visible"); c.setAttribute("cx",x(i)); c.setAttribute("cy",y(s.v[i]));});
    const rows=series.map(s=>({c:css(s.c),v:s.v[i]==null?'–':s.v[i].toFixed(3),sub:s.v[i]==null?'':`${sgn(s.v[i]-1)}${((s.v[i]-1)*100).toFixed(1)}%`,n:s.k}))
      .sort((a,b)=>(parseFloat(b.v)||-1e9)-(parseFloat(a.v)||-1e9));
    tipShow(tip,el,x(i)*k,fmtD(days[i]),rows);
  },()=>{tip.classList.remove("show"); hv.setAttribute("visibility","hidden");});
}
function drawDD(){
  const nav=D.nav; if(!nav.length) return; let pk=-1e9; const dd=nav.map(x=>{pk=Math.max(pk,x[1]);return x[1]/pk-1;}), days=nav.map(x=>x[0]);
  const el=document.getElementById("c2"), tip=document.getElementById("t2"); el.querySelector("svg")?.remove();
  const W=Math.max(300,el.clientWidth||500), H=W<640?200:220, L=42, Rr=12, T=12, B=30;
  const nt=niceTicks(Math.min(...dd,-0.01),0,4), x=scale(0,dd.length-1,L,W-Rr), y=scale(nt.lo,0,H-B,T);
  let p=`M${L},${y(0)}`; dd.forEach((v,i)=>p+=`L${x(i).toFixed(1)},${y(v).toFixed(1)}`); const line=p.slice(p.indexOf("L")).replace(/^L/,"M"); p+=`L${x(dd.length-1)},${y(0)}Z`;
  const mi=dd.indexOf(Math.min(...dd));
  let g=svgEl(W,H,`전략 낙폭 차트: 최대 ${(dd[mi]*100).toFixed(1)}%, ${fmtD(days[mi])}`);
  nt.ticks.forEach(v=>{ if(v<0) g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/>`; g+=`<text class="tk" x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v*100).toFixed(0)}%</text>`;});
  g+=`<path d="${p}" fill="${css('--s1')}" fill-opacity=".12"/><path d="${line}" fill="none" stroke="${css('--s1')}" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<line class="axis" x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}"/>`+yearTicks(days,x,H,B,false);
  g+=`<circle cx="${x(mi)}" cy="${y(dd[mi])}" r="4" fill="${css('--s1')}" stroke="${css('--surface')}" stroke-width="2"/><text x="${x(mi)>W*0.6?x(mi)-9:x(mi)+9}" text-anchor="${x(mi)>W*0.6?'end':'start'}" y="${y(dd[mi])+4}"><tspan class="lab">${(dd[mi]*100).toFixed(1)}%</tspan><tspan class="lab2" dx="5">최대 낙폭</tspan></text>`;
  g+=`<g id="hv" visibility="hidden"><line class="cx" id="cx" y1="${T}" y2="${H-B}"/><circle id="hd" r="4" fill="${css('--s1')}" stroke="${css('--surface')}" stroke-width="2"/></g></svg>`;
  el.insertAdjacentHTML("afterbegin",g);
  const svg=el.querySelector("svg"), hv=svg.querySelector("#hv"), cx=svg.querySelector("#cx"), hd=svg.querySelector("#hd");
  hover(el,svg,W,dd.length,px=>Math.round((px-L)/(W-Rr-L)*(dd.length-1)),(i,k)=>{
    cx.setAttribute("x1",x(i)); cx.setAttribute("x2",x(i)); hd.setAttribute("cx",x(i)); hd.setAttribute("cy",y(dd[i])); hv.setAttribute("visibility","visible");
    tipShow(tip,el,x(i)*k,fmtD(days[i]),[{c:css('--s1'),v:`${(dd[i]*100).toFixed(1)}%`,n:"최고점 대비"}]);
  },()=>{tip.classList.remove("show"); hv.setAttribute("visibility","hidden");});
}
function drawIC(){
  const ic=(D.ic||[]).filter(x=>x.ic!=null); if(!ic.length){const e=document.getElementById("c3"); if(!e.querySelector(".empty")) e.insertAdjacentHTML("afterbegin",'<div class="empty">IC 없음</div>');return;}
  const el=document.getElementById("c3"), tip=document.getElementById("t3"); el.querySelector("svg")?.remove();
  const W=Math.max(300,el.clientWidth||500), H=W<640?200:220, L=46, Rr=12, T=12, B=30;
  const m=Math.max(0.05,...ic.map(x=>Math.abs(x.ic))), nt=niceTicks(-m,m,6), dec=Math.max(2,decOf(nt.step));
  const slot=(W-L-Rr)/ic.length, bw=Math.min(24,Math.max(1,slot-2)), y=scale(nt.lo,nt.hi,H-B,T), y0=y(0);
  const pos=ic.filter(v=>v.ic>0).length;
  let g=svgEl(W,H,`리밸런싱별 IC 막대: ${ic.length}회 중 양수 ${pos}회`);
  nt.ticks.forEach(v=>{ if(Math.abs(v)>1e-12) g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/>`; g+=`<text class="tk" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v===0?'0':v.toFixed(dec)}</text>`;});
  // 막대: 기준선 쪽은 각지게, 끝만 4px 둥글게. 양수=1번 파랑, 0 이하=중립 회색
  const r=Math.min(4,bw/2);
  ic.forEach((v,i)=>{const cxm=L+slot*(i+.5), x0=cxm-bw/2, yv=y(v.ic), h=Math.abs(yv-y0);
    let d; if(h<r){d=`M${x0},${Math.min(yv,y0)}h${bw}v${Math.max(1,h)}h${-bw}Z`;}
    else if(v.ic>=0){d=`M${x0},${y0}V${yv+r}Q${x0},${yv} ${x0+r},${yv}H${x0+bw-r}Q${x0+bw},${yv} ${x0+bw},${yv+r}V${y0}Z`;}
    else {d=`M${x0},${y0}V${yv-r}Q${x0},${yv} ${x0+r},${yv}H${x0+bw-r}Q${x0+bw},${yv} ${x0+bw},${yv-r}V${y0}Z`;}
    g+=`<path class="bar" data-i="${i}" d="${d}" fill="${css(v.ic>0?'--s1':'--neutral')}"/>`;});
  g+=`<line class="axis" x1="${L}" x2="${W-Rr}" y1="${y0}" y2="${y0}"/>`;
  const rd=ic.map(v=>v.r); let last=-1e9; [...new Set(rd.map(d=>d.slice(0,4)))].forEach(yy=>{const i=rd.findIndex(d=>d.startsWith(yy)), px=L+slot*(i+.5); if(px-last<34) return; last=px; g+=`<text class="tk" x="${px}" y="${H-B+17}" text-anchor="middle">${yy}</text>`;});
  el.insertAdjacentHTML("afterbegin",g+"</svg>");
  document.getElementById("ic-key").innerHTML=`<span class="legend" style="display:inline-flex;margin:0;vertical-align:middle"><span><i class="box" style="background:${css('--s1')}"></i>맞음(양수) ${pos}회</span><span><i class="box" style="background:${css('--neutral')}"></i>틀림(0 이하) ${ic.length-pos}회</span></span>`;
  const svg=el.querySelector("svg"), bars=[...svg.querySelectorAll(".bar")];
  hover(el,svg,W,ic.length,px=>Math.floor((px-L)/slot),(i,k)=>{
    el.classList.add("hovering"); bars.forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
    tipShow(tip,el,(L+slot*(i+.5))*k,`리밸런싱 ${fmtD(ic[i].r)}`,[{c:css(ic[i].ic>0?'--s1':'--neutral'),v:`${sgn(ic[i].ic)}${ic[i].ic.toFixed(3)}`,n:"IC",box:true}]);
  },()=>{tip.classList.remove("show"); el.classList.remove("hovering"); bars.forEach(b=>b.classList.remove("on"));});
}
function tables(){
  const y=R.yearly||{}, ks=D.index&&D.index.KOSPI?Object.fromEntries(D.index.KOSPI):{};
  const kyr={}; let prev=null; Object.keys(ks).sort().forEach(d=>{const yy=d.slice(0,4); if(!kyr[yy]) kyr[yy]={s:prev??ks[d]}; kyr[yy].e=ks[d]; prev=ks[d];});
  document.getElementById("yr").innerHTML=`<table><thead><tr><th class="l">연도</th><th>전략</th><th>코스피</th><th>차이</th></tr></thead><tbody>${Object.keys(y).map(yy=>{const k=kyr[yy]?kyr[yy].e/kyr[yy].s-1:null;return `<tr><td class="l">${yy}</td><td>${pct(y[yy])}</td><td>${pct(k)}</td><td>${pct(k==null?null:y[yy]-k)}</td></tr>`;}).join("")}</tbody></table>`;
  const rg=R.regime_excess_vs_kospi_monthly||{};
  document.getElementById("rg").innerHTML=`<table><thead><tr><th class="l">국면(코스피 월간)</th><th>개월</th><th>월평균 초과</th></tr></thead><tbody>${Object.entries(rg).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v.months}</td><td>${pct(v.avg_excess,2)}</td></tr>`).join("")}</tbody></table>`;
  const V=D.variants;
  document.getElementById("vr").innerHTML = !V ? '<div class="empty">비교 실험 결과 없음</div>' :
   `<div class="dash" style="font-size:12px;margin-bottom:6px">${esc(V.rule)}</div><table><thead><tr><th class="l">변형</th><th>CAGR</th><th>최대낙폭</th><th>샤프</th><th>IC 평균</th><th>IC IR</th><th>적중률</th><th>회전율</th></tr></thead><tbody>${
   Object.entries(V.variants).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${pct(v.cagr)}</td><td>${pct(v.mdd)}</td><td>${num(v.sharpe)}</td><td>${num(v.ic_mean,3)}</td><td>${num(v.ic_ir,2)}</td><td>${pct(v.hit_rate,0,false)}</td><td>${pct(v.turnover,0,false)}</td></tr>`).join("")}</tbody></table>`;
  const h=D.last_holdings;
  document.getElementById("hd").innerHTML = !h ? '<div class="empty">없음</div>' :
   `<div class="dash" style="font-size:12px;margin-bottom:6px">리밸런싱 ${fmtD(h.rebalance)} · 체결 ${fmtD(h.exec)}</div><table><thead><tr><th class="l">종목</th><th>순위</th><th class="l">사업군</th></tr></thead><tbody>${h.holdings.map(x=>`<tr><td class="l">${esc(x.n)} <span class="dash">${x.c}</span></td><td>${x.rank??'–'}</td><td class="l">${esc(x.g)}</td></tr>`).join("")}</tbody></table>`;
}
