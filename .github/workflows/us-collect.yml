name: us-collect

# 미국 ETF·배당 (기본): Massive 무료 시세·배당 기록 → site/us.html
# 2026-11-01 SEC가 GitHub 실행 서버를 차단해 재무 기반 저평가 순위는 보류 (US_SEC=1일 때만 SEC 경로)
# 필요한 비밀값: MASSIVE_API_KEY (SEC_CONTACT는 SEC 경로에서만)
# 시세는 무료 분당 5회 → 실행마다 --us-price-calls 만큼만 과거 일봉을 채운다 (12-1 모멘텀에 약 250거래일 필요)

on:
  workflow_dispatch:
    inputs:
      price_calls:
        description: "이번 실행에서 새로 받을 일봉 날짜 수 (1회 약 12.5초)"
        default: "40"
        type: string

permissions:
  contents: write

# 미국 자료는 보관소에서 'us-' 조각·index-us.json만 써서 국내(l0·derived)와 겹치지 않음 → 별도 순서.
# (같은 묶음이면 국내 연속 실행이 대기 중인 미국 실행을 취소함)
concurrency:
  group: us-store
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: src

jobs:
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore US prices
        run: python -m qs.store_shards restore --kind us --dst data
      - name: Run
        id: run
        timeout-minutes: 45
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set +e
          python -m qs.cli us --us-price-calls ${{ github.event.inputs.price_calls || '40' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Save US prices
        if: always() && steps.run.outputs.code != '2'
        run: |
          if [ -d data/l0/us ]; then python -m qs.store_shards save --kind us --src data/l0/us --gen ${{ github.run_id }}; fi
      - name: Commit page
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name "Geon-E"
          git config user.email "326496254+Geon-E@users.noreply.github.com"
          for p in site/us.html reports/us; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "미국 화면 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
      - name: Fail on error
        if: steps.run.outputs.code != '0'
        run: exit 1
