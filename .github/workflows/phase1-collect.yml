name: phase1-collect

# 1단계 수집: KRX 전 종목 + DART 표본
# 데이터(L0)는 GitHub Release 'data-store'의 l0.tar.gz 자산으로 보관 (D-12).
# 실행마다: 자산 내려받기 → 수집(이미 받은 것은 건너뜀) → 매니페스트·보안 검사 → 자산 갱신 → 보고서 커밋

on:
  workflow_dispatch:
    inputs:
      command:
        description: "phase1 | evaluate | determinism | krx-backfill | sample | dart-sample | inventory | collect-all"
        default: phase1
        type: choice
        options: [phase1, universe, screen, backtest, bt-variants, bt-robust, exp-admin-rules, exp-listing, xcheck, adjust, evaluate, determinism, collect-all, krx-backfill, sample, dart-sample, inventory]
      extra:
        description: "추가 인자 (예: --reselect, --start 2025-09-01)"
        default: ""
        type: string
      chain_until:
        description: "이 시각(UTC, 예: 2026-10-31T23:00:00Z)까지 성공할 때마다 같은 설정으로 다음 실행을 이어서 건다. 비우면 한 번만"
        default: ""
        type: string
  # 일일 운영은 Claude 예약 작업이 매일 08:45 KST에 workflow_dispatch로 시작한다 (2026-10-26~, 사용자 결정).
  # GitHub schedule은 2~3시간씩 늦게 돌아 같은 날 두 번 실행 → DART 하루 한도·Actions 무료 시간을 이중으로 써서 제거 (2026-10-29).

permissions:
  contents: write
  actions: write   # chain_until: 성공한 실행이 다음 실행을 건다 (workflow_dispatch는 GITHUB_TOKEN으로도 새 실행이 생김)

concurrency:
  group: data-store
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: src

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore data-store
        run: |
          gh release view data-store >/dev/null 2>&1 || gh release create data-store --title "data-store" --notes "파이프라인 데이터 보관소 (L0~L2). 수동 편집 금지." --prerelease
          mkdir -p data
          # 조각·세대 방식 보관소 (src/qs/store_shards.py — 2026-10-30 단일 파일 2GiB 초과 사고 후)
          python -m qs.store_shards restore --kind derived --dst data
          python -m qs.store_shards restore --kind l0 --dst data
          if [ -f data/l0/MANIFEST.json ]; then
            python -c "from qs.storage import verify_manifest, L0; b=verify_manifest(L0); print('manifest 불일치', len(b)); print(b[:5])"
          fi

      - name: Run
        id: run
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set +e
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then CMD=phase1; fi
          python -m qs.cli $CMD ${{ github.event.inputs.extra }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "exit code $code"

      - name: Save data-store
        if: steps.run.outputs.code != '2'
        run: |
          set -e
          # 새 세대 조각을 모두 올린 뒤 목차를 바꾸고, 그다음에만 이전 세대를 지운다 (실패해도 이전 세대 유지)
          if [ -d data/l0 ]; then
            python -m qs.store_shards save --kind l0 --src data/l0 --gen ${{ github.run_id }}
          fi
          # 파생 데이터(L1·L2)는 실행이 완전히 성공했을 때만 교체 → 실패 시 마지막 정상본 유지
          if [ "${{ steps.run.outputs.code }}" = "0" ]; then
            python -m qs.store_shards save --kind derived --src data --layers l1 l2 --gen ${{ github.run_id }}
          fi
          # 스크리너 화면(데이터 내장 HTML)은 저장소에 커밋하지 않고 릴리스 파일로 교체 (매일 수 MB 누적 방지)
          if [ -f reports/screen/screener.html ] && [ "${{ steps.run.outputs.code }}" = "0" ]; then
            gh release upload data-store reports/screen/screener.html --clobber
          fi

      - name: Commit reports
        if: steps.run.outputs.code != '2'
        run: |
          # Vercel Hobby는 계정 소유자(GitHub Geon-E)와 연결된 작성자의 커밋만 배포한다 → 봇 대신 저장소 소유자 계정의 GitHub noreply 주소로 커밋
          # (2026-10-25: github-actions[bot]·연결 안 된 이메일 커밋은 모두 BLOCKED)
          git config user.name "Geon-E"
          git config user.email "326496254+Geon-E@users.noreply.github.com"
          # 없는 경로가 하나라도 있으면 git add 전체가 실패한다 → 경로별로 있는 것만 추가 (2026-10-25: reports/backtest 미존재로 커밋 누락)
          for p in reports/phase1 reports/screen/screen.json reports/backtest site config/sample_v1.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "1단계 실행 결과 (${{ github.event.inputs.command || 'phase1(일일)' }}, $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          # 체크아웃 시점 이후 다른 실행이 보고서를 커밋했을 수 있음 → 충돌 시 이번 실행 결과를 우선(-X theirs = 재적용되는 쪽)
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "보고서 push 실패"; exit 1; fi

      - name: Fail on error
        if: steps.run.outputs.code != '0'
        run: |
          echo "수집 명령이 오류 코드 ${{ steps.run.outputs.code }}로 끝났습니다. reports/phase1/last_run.json 확인."
          exit 1

      - name: Chain next run
        if: success() && github.event.inputs.chain_until != ''
        run: |
          now=$(date -u +%s); until=$(date -u -d "${{ github.event.inputs.chain_until }}" +%s)
          if [ "$now" -lt "$until" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/phase1-collect.yml/dispatches \
              -f ref=main -f "inputs[command]=${{ github.event.inputs.command }}" \
              -f "inputs[extra]=${{ github.event.inputs.extra }}" -f "inputs[chain_until]=${{ github.event.inputs.chain_until }}"
            echo "다음 실행을 걸었음 (~ ${{ github.event.inputs.chain_until }})"
          else
            echo "이어 걸기 종료 시각 지남"
          fi
