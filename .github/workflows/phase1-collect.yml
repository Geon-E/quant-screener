name: phase1-collect

# 1단계 수집: KRX 전 종목 + DART 표본
# 데이터(L0)는 GitHub Release 'data-store'의 l0.tar.gz 자산으로 보관 (D-12).
# 실행마다: 자산 내려받기 → 수집(이미 받은 것은 건너뜀) → 매니페스트·보안 검사 → 자산 갱신 → 보고서 커밋

on:
  workflow_dispatch:
    inputs:
      command:
        description: "phase1 | evaluate | determinism | krx-backfill | sample | dart-sample | inventory | collect-all"
        default: phase1
        type: choice
        options: [phase1, universe, screen, backtest, bt-variants, bt-robust, exp-admin-rules, exp-listing, xcheck, adjust, evaluate, determinism, collect-all, krx-backfill, sample, dart-sample, inventory]
      extra:
        description: "추가 인자 (예: --reselect, --start 2025-09-01)"
        default: ""
        type: string
  schedule:
    # 일일 운영: 매일 07:40 KST. 데이터 채우는 기간에는 주말·월요일도 DART 하루 호출 한도를 쓰도록 매일 실행
    # (KRX는 휴장일이면 빈 결과로 기록하고 넘어감). D-08 측정 결과에 따라 시각 조정 예정
    - cron: "40 22 * * *"

permissions:
  contents: write

concurrency:
  group: data-store
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: src

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore data-store
        run: |
          gh release view data-store >/dev/null 2>&1 || gh release create data-store --title "data-store" --notes "파이프라인 데이터 보관소 (L0~L2). 수동 편집 금지." --prerelease
          mkdir -p data
          gh release download data-store -p derived.tar.gz -D /tmp/ds 2>/dev/null && tar -xzf /tmp/ds/derived.tar.gz -C data || true
          if gh release download data-store -p l0.tar.gz -D /tmp/ds 2>/dev/null; then
            tar -xzf /tmp/ds/l0.tar.gz -C data
            python -c "from qs.storage import verify_manifest, L0; b=verify_manifest(L0); print('manifest 불일치', len(b)); print(b[:5])"
          else
            echo "기존 L0 없음 — 처음부터 수집"
          fi

      - name: Run
        id: run
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set +e
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then CMD=phase1; fi
          python -m qs.cli $CMD ${{ github.event.inputs.extra }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "exit code $code"

      - name: Save data-store
        if: steps.run.outputs.code != '2'
        run: |
          if [ -d data/l0 ]; then
            tar -czf /tmp/l0.tar.gz -C data l0
            ls -lh /tmp/l0.tar.gz
            gh release upload data-store /tmp/l0.tar.gz --clobber
          fi
          # 파생 데이터(L1·L2)는 실행이 완전히 성공했을 때만 교체 → 실패 시 마지막 정상본 유지
          layers=$(cd data && ls -d l1 l2 2>/dev/null | tr '\n' ' ')
          if [ -n "$layers" ] && [ "${{ steps.run.outputs.code }}" = "0" ]; then
            tar -czf /tmp/derived.tar.gz -C data $layers
            gh release upload data-store /tmp/derived.tar.gz --clobber
          fi
          # 스크리너 화면(데이터 내장 HTML)은 저장소에 커밋하지 않고 릴리스 파일로 교체 (매일 수 MB 누적 방지)
          if [ -f reports/screen/screener.html ] && [ "${{ steps.run.outputs.code }}" = "0" ]; then
            gh release upload data-store reports/screen/screener.html --clobber
          fi

      - name: Commit reports
        if: steps.run.outputs.code != '2'
        run: |
          # Vercel Hobby는 계정 소유자(GitHub Geon-E)와 연결된 작성자의 커밋만 배포한다 → 봇 대신 저장소 소유자 계정의 GitHub noreply 주소로 커밋
          # (2026-10-25: github-actions[bot]·연결 안 된 이메일 커밋은 모두 BLOCKED)
          git config user.name "Geon-E"
          git config user.email "326496254+Geon-E@users.noreply.github.com"
          # 없는 경로가 하나라도 있으면 git add 전체가 실패한다 → 경로별로 있는 것만 추가 (2026-10-25: reports/backtest 미존재로 커밋 누락)
          for p in reports/phase1 reports/screen/screen.json reports/backtest site config/sample_v1.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "1단계 실행 결과 (${{ github.event.inputs.command || 'phase1(일일)' }}, $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          # 체크아웃 시점 이후 다른 실행이 보고서를 커밋했을 수 있음 → 충돌 시 이번 실행 결과를 우선(-X theirs = 재적용되는 쪽)
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "보고서 push 실패"; exit 1; fi

      - name: Fail on error
        if: steps.run.outputs.code != '0'
        run: |
          echo "수집 명령이 오류 코드 ${{ steps.run.outputs.code }}로 끝났습니다. reports/phase1/last_run.json 확인."
          exit 1
