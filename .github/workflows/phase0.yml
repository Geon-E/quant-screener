name: phase0-probe

# 0단계 데이터 확보 가능성 점검
# - 수동 실행(workflow_dispatch): 전체 점검 → reports/phase0/phase0_report.md
# - 평일 스케줄: KRX 당일 시세 제공 시각 측정 → reports/phase0/timing.csv
#   (측정이 끝나면 schedule 블록을 삭제할 것 — DECISIONS D-08)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체 점검, timing = 제공 시각 1회 측정, amend = 정정공시 점검만"
        default: full
        type: choice
        options: [full, timing, amend]
  schedule:
    # KST 15:40 / 16:40 / 17:40 / 18:40 / 20:40 (월~금), 다음날 08:10 (화~토)
    - cron: "40 6,7,8,9,11 * * 1-5"
    - cron: "10 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: phase0
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests finance-datareader

      - name: Run probe
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=timing; fi
          python scripts/phase0_probe.py --mode "$MODE"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase0
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "0단계 점검 결과 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
