# 외부 소스 사용 조건 기록 (자동 수집 허용 여부의 근거)
kind:
  robots_txt: absent        # 2026-10-25 사용자가 브라우저로 kind.krx.co.kr/robots.txt 확인 → "요청하신 페이지는 존재하지 않습니다"
  evidence: docs/evidence_kind_robots_2026-10-25.jpg
  note: >
    자동 요청에는 방화벽 차단 페이지가 응답되어 robots 상태를 확인할 수 없었음(2026-10-25 실측).
    robots.txt가 없으면 표준상 제한 없음. 단 개인 연구용·저빈도로만 사용: 관리종목 현재 목록 하루 1회.
    방화벽 차단이 응답되면 그날은 수집하지 않고 재시도하지 않는다.
  allowed_paths: ["/investwarn/adminissue.do"]
  max_requests_per_day: 1
