# 거래비용 v1 (DESIGN 6.4) — 수익률을 계산하기 전(2026-10-25)에 고정. 변경 시 새 버전 + EXPERIMENTS.md 기록
version: v1

# 증권거래세(매도 시, 코스피는 농어촌특별세 포함 합계). 시행일 기준
# 출처 (2026-10-25 확인, 코스피 = 증권거래세 + 농어촌특별세 0.15%):
#   2019-05-30 코스피 0.15→0.10%(+농특 0.15) / 코스닥 0.30→0.25% — 시사경제(매매체결분부터 적용)
#   2022 코스피 0.08%·코스닥 0.23%, 2023 0.05%·0.20%, 2024 0.03%·0.18%, 2025 0%·0.15% — MTN(2022-12-30)
#   2023 합계 0.20%·2025 0.15% — 택스워치(2023-03-16) / 2026 코스피 0.05+0.15·코스닥 0.20% — 세계일보(2026-01-05)
#   2021-01-01 인하(0.23%) 시행일은 MTN 2022 세율과 일치하는 것으로 확인
sell_tax:
  - {from: 2015-01-01, KOSPI: 0.0030, KOSDAQ: 0.0030}
  - {from: 2019-05-30, KOSPI: 0.0025, KOSDAQ: 0.0025}
  - {from: 2021-01-01, KOSPI: 0.0023, KOSDAQ: 0.0023}
  - {from: 2023-01-01, KOSPI: 0.0020, KOSDAQ: 0.0020}
  - {from: 2024-01-01, KOSPI: 0.0018, KOSDAQ: 0.0018}
  - {from: 2025-01-01, KOSPI: 0.0015, KOSDAQ: 0.0015}
  - {from: 2026-01-01, KOSPI: 0.0020, KOSDAQ: 0.0020}

commission: 0.00015        # 편도, 온라인 증권사 일반 수준

# 스프레드 절반 (편도) — 시가총액 구간별 가정
spread_half:
  - {mcap_min: 1.0e+12, rate: 0.0005}    # 1조 이상
  - {mcap_min: 2.0e+11, rate: 0.0015}    # 2천억~1조
  - {mcap_min: 0,      rate: 0.0030}    # 2천억 미만

# 시장충격 (보수 시나리오): 주문금액 ÷ 20일 평균 거래대금 1%당 0.10%
impact_per_participation_pct: 0.0010

capital_krw: 1.0e+8          # 기준 운용금액 (유동성 한도·시장충격 계산용)

scenarios:
  optimistic: [sell_tax, commission]
  base: [sell_tax, commission, spread_half]
  conservative: [sell_tax, commission, spread_half, impact]
